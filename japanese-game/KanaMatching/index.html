<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Ranked Kana Match</title>
        <meta name="description" content="Learn Japanese Kana through matching">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./kana_matching.css">
        <link rel="stylesheet" href="../main.css">
    </head>
    <body>
        
        <div id="game-wrapper">
            <div id="game-info">
                <span><button id="menu-button" class="primary-button" onclick="window.location.href='index.html'">Main Menu</button></span>
                <span>Time: <span id="time-display">30.0</span>s</span>
                <span>Score: <span id="score-display">0</span></span>
                <span id="main-user-display"></span>
            </div>
            
            <table>
                <tr>
                    <td id="cell1"></td><td id="cell2"></td><td id="cell3"></td><td id="cell4"></td>
                </tr>
                <tr>
                    <td id="cell5"></td><td id="cell6"></td><td id="cell7"></td><td id="cell8"></td>
                </tr>
                <tr>
                    <td id="cell9"></td><td id="cell10"></td><td id="cell11"></td><td id="cell12"></td>
                </tr>
                <tr>
                    <td id="cell13"></td><td id="cell14"></td><td id="cell15"></td><td id="cell16"></td>
                </tr>
            </table>
            
            <div id="start-modal">
                <div class="modal-content">
                    <h2>Kana Match</h2>
                    
                    <select id="mode-select">
                        <option value="katakana">Katakana</option>
                        <option value="hiragana">Hiragana</option>
                    </select>

                    <div id="user-stats" class="hidden">
                        <p class="modal-text">Personal High Score: <span id="high-score-display">0</span></p>
                        
                        <div class="leaderboard-container">
                            <h3>Top 10 Players</h3>
                            <ol id="leaderboard-list"></ol>
                        </div>
                    </div>

                    <p id="guest-warning" class="hidden">Playing as Guest. Scores will not be saved on the Leaderboard.</p>
                    
                    <div class="modal-button-group">
                        <button class="primary-button secondary-button" onclick="window.location.href='../'">Main Menu</button>
                        <button id="start-btn" class="primary-button">Start Game</button>
                    </div>
                </div>
            </div>
            
            <div id="end-modal" class="hidden">
                <div class="modal-content">
                    <h2>Game Over!</h2>
                    <p class="modal-text">Score: <span id="final-score"></span></p>
                    <p class="modal-text">Total Time: <span id="final-time"></span>s</p>
                    <button id="restart-btn" class="primary-button">Play Again</button>
                    <button class="primary-button secondary-button" onclick="window.location.href='index.html'">Main Menu</button>
                </div>
            </div>
        </div>
        
        <script type="module" src="kanaMatch.js"></script>
        
    </body>
</html>
