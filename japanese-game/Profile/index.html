<!DOCTYPE html>
<html>
<head>
        <meta charset="utf-8">
        <title>Player Profile</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <link rel="stylesheet" href="../main.css">
        <link rel="stylesheet" href="profile.css">
    </head>
    <body>
        <div id="profile-wrapper">
            <h1 id="profile-username" style="font-size: 4cqw; margin-top: 0;">Loading...</h1>
            
            <div id="stats-container" class="hidden">
                <div class="stat-box">Katakana Rush: <strong id="stat-kata-rush">0</strong></div>
                <div class="stat-box">Hiragana Rush: <strong id="stat-hira-rush">0</strong></div>
            </div>

            <p id="error-message" style="color: red;"></p>

            <div style="margin-top: 2cqw;">
                <button class="btn back-btn" onclick="window.location.href='../'">Back to Menu</button>
                <button id="add-friend-btn" class="btn friend-btn hidden">Add Friend</button>
            </div>
        </div>

        <script type="module" src="profile.js"></script>
    </body>
</html>
