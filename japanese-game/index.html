<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Dojolingo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="home_page.css">
        <link rel="stylesheet" href="main.css">
    </head>
    <body>
        
        <div id="menu-wrapper">
            <h1>Dojolingo</h1>
            <p id="user-status">Checking login...</p>
            
            <button class="menu-button" onclick="window.location.href='./KanaMatching'">Casual</button>
            <button id="btn-multiplayer" class="menu-button disabled-btn">Ranked</button>
            <button id="btn-profile" class="menu-button disabled-btn">Profile</button>
            
            <button id="btn-login-ui" class="menu-button login-ui-btn hidden">Login / Register</button>
            <button id="btn-logout-ui" class="menu-button logout-ui-btn hidden">Logout</button>

            <div id="auth-modal" class="hidden">
                <div class="modal-content">
                    <h2>Account Access</h2>
                    <input type="text" id="username-input" class="modal-input" placeholder="Username">
                    <input type="password" id="password-input" class="modal-input" placeholder="Password">
                    <button id="login-submit" class="menu-button modal-submit-btn">Login</button>
                    <button id="register-submit" class="menu-button modal-submit-btn">Register</button>
                    <p id="auth-error"></p>
                    <button id="close-modal">Cancel</button>
                </div>
            </div>
        </div>

        <script type="module" src="home_page.js"></script>
    </body>
</html>
