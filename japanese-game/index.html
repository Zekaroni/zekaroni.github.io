<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Japanese Game</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="stylesheet.css">
    </head>
    <body>
        
        <div id="game-info">
            <span><button id="menu-button" class="primary-button">Menu</button></span>
            <span>Time: <span id="time-display">30.0</span>s</span>
            <span>Score: <span id="score-display">0</span></span>
            <span id="main-user-display"></span>
            <button id="logout-btn" class="primary-button">Logout</button>
        </div>

        <table>
            <tr>
                <td id="cell1"></td>
                <td id="cell2"></td>
                <td id="cell3"></td>
                <td id="cell4"></td>
            </tr>
            <tr>
                <td id="cell5"></td>
                <td id="cell6"></td>
                <td id="cell7"></td>
                <td id="cell8"></td>
            </tr>
            <tr>
                <td id="cell9"></td>
                <td id="cell10"></td>
                <td id="cell11"></td>
                <td id="cell12"></td>
            </tr>
            <tr>
                <td id="cell13"></td>
                <td id="cell14"></td>
                <td id="cell15"></td>
                <td id="cell16"></td>
            </tr>
        </table>

        <div id="start-modal">
            <div class="modal-content">
                <h2>Kana Match</h2>
                <select id="mode-select">
                    <option value="katakana">Katakana</option>
                    <option value="hiragana">Hiragana</option>
                </select>
                <div id="auth-section">
                    <input type="text" id="username-input" placeholder="Username" style="display:block; margin: 10px auto; padding: 5px;">
                    <input type="password" id="password-input" placeholder="Password" style="display:block; margin: 10px auto; padding: 5px;">
                    <button id="login-btn" style="margin: 5px;">Login</button>
                    <button id="register-btn" style="margin: 5px;">Register</button>
                    <p id="auth-error" style="color: red; font-size: 0.9rem;"></p>
                </div>
                <div id="user-info" class="hidden">
                    <p>Personal High Score: <span id="high-score-display">0</span></p>
                    
                    <div class="leaderboard-container" style="text-align: left; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ccc;">
                        <h3 style="margin-top: 0; text-align: center; color: #333;">Top 10 Players</h3>
                        <ol id="leaderboard-list" style="font-size: 1.1rem; padding-left: 25px; margin-bottom: 0; color: #333;"></ol>
                    </div>
                </div>
                <button id="start-btn" class="hidden">Start Game</button>
            </div>
        </div>
        
        <div id="end-modal" class="hidden">
            <div class="modal-content">
                <h2>Game Over!</h2>
                <p>Score: <span id="final-score"></span></p>
                <p>Total Time: <span id="final-time"></span>s</p>
                <button id="restart-btn">Restart</button>
            </div>
        </div>
        
        
        <script type="module" src="script.js"></script>
        
    </body>
</html>
